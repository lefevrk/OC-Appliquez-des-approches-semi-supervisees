[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mri", "src/utils"]

[project]
name = "brain-mri"
version = "0.3.0"
description = "Semi-supervised brain MRI tumor detection and image analysis"
authors = [{ name = "Kilian LEFEVRE" }]

readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "typer",
  "loguru",
  "tqdm",
  "numpy",
  "pandas>=3.0.0",
  "matplotlib",
  "pillow",
  "python-dotenv",
  "scikit-learn",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "mlflow>=3.9,<4",
  "opencv-python>=5.0.0.93",
  "ipywidgets>=8.1.9",
]
requires-python = ">=3.12"

[tool.ruff]
line-length = 80
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]
extend-include = ["*.ipynb"]
exclude = ["tests/**.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B"]
ignore = ["E501", "D100", "D104"]

[tool.ruff.lint.isort]
known-first-party = ["brain_mri", "utils"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = ["test_*.py", "**/test_.py", "test.py"]

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
  "notebook",
  "pre-commit>=4.5.1",
  "pyright>=1.1.408",
  "pytest",
  "pytest-cov>=7.1.0",
  "ruff>=0.14.14",
  "pandas-stubs>=3.0.0.260204",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.7",
]

[tool.uv]
default-groups = ["dev", "docs"]
